<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de Auditoria de Contratos</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 600px;
            text-align: center;
            border: 1px solid #334155;
        }
        h1 { color: #38bdf8; font-size: 1.6rem; margin-bottom: 0.5rem; }
        .badge {
            display: inline-block;
            background: #10b981;
            color: white;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin: 1rem 0;
        }
        p { color: #94a3b8; line-height: 1.6; }
        .footer { font-size: 0.8rem; color: #64748b; margin-top: 1.5rem; border-top: 1px solid #334155; padding-top: 1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Asistente de Auditoría y Cumplimiento Regulatorio</h1>
        <div class="badge">? Docker & Docker Hub Operativos</div>
        <p>Plataforma para extracción de cláusulas críticas, análisis de SLAs y detección de riesgos normativos en contratos financieros y de software.</p>
        <div class="footer">
            Proyecto de Grado | Autor: Eduardo (@eduarpj) | Versión 0.1
        </div>
    </div>
</body>
</html>
